<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Xinergy Match & Synth | Tactical Cyber-Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

<!-- AdsGram Official SDK Integration -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
:root {
  --bg-gradient: radial-gradient(circle at 50% 0%, #0d1527 0%, #05070b 100%);
  --panel-bg: rgba(13, 20, 33, 0.85);
  --panel-border: rgba(0, 229, 255, 0.3);
  --cyan: #00e5ff;
  --green: #00ff66;
  --purple: #9d00ff;
  --pink: #ff0077;
  --orange: #ff9900;
  --text-main: #f4f7fa;
  --text-muted: #8e9bb0;
  --head-font: 'Chakra Petch', sans-serif;
  --body-font: 'Manrope', sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: var(--body-font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-x: hidden;
}

/* MAIN GAME CONTAINER */
.app-container {
  width: 100%;
  max-width: 420px;
  background: var(--panel-bg);
  border: 1.5px solid var(--panel-border);
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 0 35px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* TOP HUD */
.hud-top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  background: rgba(5, 9, 16, 0.75);
  border: 1px solid rgba(0, 229, 255, 0.2);
  border-radius: 12px;
  padding: 8px 12px;
}

.multiplier-badge {
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(157, 0, 255, 0.3));
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-family: var(--head-font);
  font-weight: 700;
  font-size: 1.1rem;
  padding: 4px 10px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
}

.timer-box {
  text-align: center;
}

.timer-val {
  font-family: var(--head-font);
  font-size: 1.5rem;
  font-weight: 700;
  color: #ff4757;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 71, 87, 0.5);
}

.score-box {
  text-align: right;
}

.score-lbl {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.score-val {
  font-family: var(--head-font);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--green);
  text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
}

/* CANVAS CANVAS BOARD WRAPPER */
.board-container {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  border-radius: 16px;
  border: 2px solid rgba(157, 0, 255, 0.4);
  background: rgba(6, 10, 18, 0.95);
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 20px rgba(157, 0, 255, 0.2);
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

/* BOTTOM HUD & POWER-UPS */
.hud-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: rgba(5, 9, 16, 0.75);
  border: 1px solid rgba(0, 229, 255, 0.15);
  border-radius: 12px;
  padding: 8px 10px;
}

.icon-btn {
  width: 44px;
  height: 44px;
  background: rgba(157, 0, 255, 0.15);
  border: 1px solid var(--purple);
  border-radius: 10px;
  color: #d1a3ff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}

.icon-btn:active {
  transform: scale(0.92);
  background: rgba(157, 0, 255, 0.3);
}

.slots-row {
  display: flex;
  gap: 8px;
}

.slot-item {
  width: 44px;
  height: 44px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px dashed rgba(0, 229, 255, 0.4);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.slot-item svg {
  width: 24px;
  height: 24px;
}

.slot-count {
  position: absolute;
  bottom: -2px;
  right: -2px;
  background: var(--cyan);
  color: #000;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 6px;
  font-family: var(--head-font);
}

/* ADSGRAM BOOSTERS PANEL */
.ads-panel {
  background: rgba(5, 9, 16, 0.85);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.panel-header {
  font-family: var(--head-font);
  font-size: 0.85rem;
  color: var(--cyan);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn-arcade {
  font-family: var(--head-font);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
}

.btn-arcade:active {
  transform: scale(0.96);
}

.btn-green {
  background: linear-gradient(135deg, #00ff66, #009933);
  color: #021206;
  box-shadow: 0 0 12px rgba(0, 255, 102, 0.25);
}

.btn-purple {
  background: linear-gradient(135deg, #9d00ff, #550099);
  color: #ffffff;
  box-shadow: 0 0 12px rgba(157, 0, 255, 0.25);
}

.btn-blue {
  background: linear-gradient(135deg, #00e5ff, #006699);
  color: #021016;
  grid-column: span 2;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
}

/* MODAL / TOAST */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal-content {
  background: #0d1421;
  border: 2px solid var(--cyan);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  max-width: 320px;
  box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
}

.modal-title {
  font-family: var(--head-font);
  font-size: 1.2rem;
  color: var(--cyan);
  margin-bottom: 8px;
}

.modal-desc {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.modal-close {
  background: var(--cyan);
  color: #000;
  font-family: var(--head-font);
  font-weight: 700;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
}

/* SVG SPRITES (HIDDEN CONTAINER) */
.svg-defs {
  display: none;
}
</style>
</head>
<body>

<!-- VECTOR SVG GRAPHICS DEFINITIONS -->
<svg class="svg-defs">
  <defs>
    <!-- CRISTAL NEÓN (💎) -->
    <g id="svg-crystal">
      <polygon points="25,5 40,18 35,42 15,42 10,18" fill="url(#cyan-grad)" stroke="#00e5ff" stroke-width="2"/>
      <polygon points="25,5 25,42 15,42 10,18" fill="rgba(255,255,255,0.2)"/>
      <line x1="25" y1="5" x2="40" y2="18" stroke="#ffffff" stroke-width="1.5"/>
      <radialGradient id="cyan-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00ffff"/>
        <stop offset="100%" stop-color="#006699"/>
      </radialGradient>
    </g>

    <!-- ORBE ENERGÍA (🟢) -->
    <g id="svg-orb">
      <circle cx="25" cy="25" r="18" fill="url(#green-grad)" stroke="#00ff66" stroke-width="2"/>
      <circle cx="20" cy="18" r="5" fill="#ffffff" opacity="0.6"/>

    <!-- NÚCLEO SINTÉTICO (👁️) -->

      <rect x="8" y="8" width="34" height="34" rx="8" fill="url(#purple-grad)" stroke="#9d00ff" stroke-width="2"/>
      <circle cx="25" cy="25" r="8" fill="#000000" stroke="#ff00ff" stroke-width="2"/>
      <circle cx="25" cy="25" r="3" fill="#00ffff"/>

    <!-- ESFERA PLASMA (🟠) -->
    <g id="svg-plasma">
      <circle cx="25" cy="25" r="18" fill="url(#orange-grad)" stroke="#ff9900" stroke-width="2"/>
      <polygon points="25,10 30,20 25,30 20,20" fill="#ffffff" opacity="0.8"/>
      <radialGradient id="orange-grad" cx="50%" cy="50%" r="50%">

    <g id="svg-creature">

      <circle cx="19" cy="22" r="3" fill="#ffffff"/>
      <circle cx="31" cy="22" r="3" fill="#ffffff"/>
      <circle cx="19" cy="22" r="1.5" fill="#000"/>

      <radialGradient id="pink-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff66b2"/>

    <!-- MURO/ROCA OBSTÁCULO (🪨) -->
    <g id="svg-rock">
      <polygon points="10,12 22,6 38,10 44,26 36,42 14,40 6,26" fill="url(#rock-grad)" stroke="#667788" stroke-width="2"/>
      <line x1="22" y1="6" x2="26" y2="24" stroke="#334455" stroke-width="2"/>
      <line x1="26" y1="24" x2="36" y2="42" stroke="#334455" stroke-width="2"/>
      <linearGradient id="rock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4a5568"/>
        <stop offset="100%" stop-color="#1a202c"/>
      </linearGradient>
    </g>
  </defs>
</svg>

<!-- GAME MINI APP INTERFACE -->
<div class="app-container">
  
  <!-- HUD TOP -->
  <div class="hud-top">
    <div class="multiplier-badge" id="multi-tag">x6</div>
    <div class="timer-box">
      <div class="timer-val" id="timer-display">00:25</div>
    </div>
    <div class="score-box">
      <div class="score-lbl">Score / $XLABS</div>
      <div class="score-val" id="score-display">53,023</div>
    </div>
  </div>

  <!-- PUZZLE CANVAS BOARD -->
  <div class="board-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- HUD BOTTOM -->
  <div class="hud-bottom">
    <button class="icon-btn" onclick="togglePause()" title="Pausa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>

    <div class="slots-row">
      <div class="slot-item" title="Cristales Extra">
        <svg viewBox="0 0 50 50"><use href="#svg-crystal"/></svg>
        <span class="slot-count" id="count-crystals">3</span>
      </div>
      <div class="slot-item" title="Bomba Sintética">
        <svg viewBox="0 0 50 50"><use href="#svg-core"/></svg>
        <span class="slot-count" id="count-bombs">1</span>
      </div>
    </div>

    <button class="icon-btn" onclick="triggerAd('tiempo')" title="Más Tiempo (+⌛)" style="border-color: var(--cyan); color: var(--cyan);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 15"/>
      </svg>
    </button>
  </div>

  <!-- ADSGRAM BOOSTERS CONTROL PANEL -->
  <div class="ads-panel">
    <div class="panel-header">⚡ ADSGRAM BOOSTERS (BLOCK 54913)</div>
    <div class="btn-grid">
      <button class="btn-arcade btn-green" onclick="triggerAd('continuar')">
        ⚡ CONTINUAR (+VIDAS)
      </button>
      <button class="btn-arcade btn-purple" onclick="triggerAd('cristales')">
        💎 CRISTALES EXTRA
      </button>
      <button class="btn-arcade btn-blue" onclick="triggerAd('diaria')">
        🎁 RECLAMAR RECOMPENSA DIARIA
      </button>
    </div>
  </div>

</div>

<!-- MODAL SYSTEM -->
<div class="modal-overlay" id="custom-modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">MENSAJE</div>
    <div class="modal-desc" id="modal-desc">Detalles del evento.</div>
    <button class="modal-close" onclick="closeModal()">ACEPTAR</button>
  </div>
</div>

<script>
/* ==========================================================================
   ADSGRAM SDK INITIALIZATION
   ========================================================================== */
let AdController = null;
try {
  if (window.Adsgram) {
    AdController = window.Adsgram.init({ blockId: "54913", debug: false });
  }
} catch (e) {
  console.warn("AdsGram SDK load warning:", e);
}

function showNotice(title, desc) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-desc').innerText = desc;
  document.getElementById('custom-modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('custom-modal').style.display = 'none';
}

function triggerAd(type) {
  if (AdController) {
    AdController.show().then((result) => {
      handleAdReward(type);
    }).catch((err) => {
      showNotice("ANUNCIO NO COMPLETADO", "Completa la visualización para reclamar la recompensa.");
    });
  } else {
    // Fallback simulation for non-Telegram/dev environments
    handleAdReward(type);
  }
}

function handleAdReward(type) {
  if (type === 'tiempo') {
    timeRemaining += 15;
    updateTimerDisplay();
    showNotice("⏳ +15 SEGUNDOS", "¡Se agregaron 15 segundos extra al temporizador táctico!");
  } else if (type === 'continuar') {
    timeRemaining += 25;
    updateTimerDisplay();
    showNotice("⚡ PARTIDA RECUPERADA", "¡Has obtenido tiempo y energía para continuar la competencia!");
  } else if (type === 'cristales') {
    crystalsCount += 5;
    document.getElementById('count-crystals').innerText = crystalsCount;
    showNotice("💎 CRISTALES RECIBIDOS", "¡5 Cristales neón agregados a tu inventario!");
  } else if (type === 'diaria') {
    score += 2500;
    updateScoreDisplay();
    showNotice("🎁 RECOMPENSA DIARIA", "¡+2,500 $XLABS acreditados en tu marcador semanal!");
  }
}

/* ==========================================================================
   GAME ENGINE & CANVAS TILE SYSTEM
   ========================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 6;
let tileSize = 0;
let score = 53023;
let multiplier = 6;
let timeRemaining = 25;
let crystalsCount = 3;
let isPaused = false;
let timerInterval = null;

// Tile Types Definition
const TILE_TYPES = [
  { id: 0, name: 'crystal', svgId: 'svg-crystal' },
  { id: 1, name: 'orb', svgId: 'svg-orb' },
  { id: 2, name: 'core', svgId: 'svg-core' },
  { id: 3, name: 'plasma', svgId: 'svg-plasma' },
  { id: 4, name: 'creature', svgId: 'svg-creature' },
  { id: 5, name: 'rock', svgId: 'svg-rock', obstacle: true }
];

let board = [];
let selectedTile = null;
let svgImages = {};

// Preload SVG vectors into Image objects for high-performance Canvas rendering
function loadSvgAssets() {
  TILE_TYPES.forEach(tile => {
    const symbol = document.getElementById(tile.svgId);
    const svgString = new XMLSerializer().serializeToString(symbol);
    const svgBlob = new Blob([
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">${svgString}</svg>`
    ], { type: 'image/svg+xml;charset=utf-8' });
    
    const img = new Image();
    img.src = URL.createObjectURL(svgBlob);
    svgImages[tile.id] = img;
  });
}

function resizeCanvas() {
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  tileSize = canvas.width / GRID_SIZE;
  renderBoard();
}

function initBoard() {
  board = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    let row = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      // 10% chance of rock obstacle, otherwise random tile
      let typeId = (Math.random() < 0.1) ? 5 : Math.floor(Math.random() * 5);
      row.push({ type: typeId, scale: 1, animOffset: 0 });
    }
    board.push(row);
  }
}

function renderBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Render Cells Background
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const x = c * tileSize;
      const y = r * tileSize;

      ctx.fillStyle = 'rgba(20, 30, 45, 0.6)';
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 8 * window.devicePixelRatio);
      ctx.fill();
      ctx.stroke();

      // Highlight Selection
      if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 8 * window.devicePixelRatio);
        ctx.fill();
        ctx.stroke();
      }

      // Draw SVG Tile Graphic
      const tile = board[r][c];
      if (tile && svgImages[tile.type]) {
        const img = svgImages[tile.type];
        const padding = 6 * window.devicePixelRatio;
        const drawSize = tileSize - (padding * 2);

        ctx.save();
        ctx.translate(x + tileSize / 2, y + tileSize / 2);
        if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
          ctx.scale(1.1, 1.1);
        }
        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }
    }
  }
}

/* ==========================================================================
   MATCH & SYNTH GAMEPLAY LOGIC
   ========================================================================== */
canvas.addEventListener('click', (e) => {
  if (isPaused || timeRemaining <= 0) return;

  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  const col = Math.floor(clickX / tileSize);
  const row = Math.floor(clickY / tileSize);

  if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
    handleTileClick(row, col);
  }
});

function handleTileClick(r, c) {
  const tile = board[r][c];
  if (tile.type === 5) return; // Rocks are obstacles

  if (!selectedTile) {
    selectedTile = { r, c };
  } else {
    // If clicked adjacent tile -> Swap
    if (isAdjacent(selectedTile, { r, c })) {
      swapTiles(selectedTile, { r, c });
      if (!checkAndResolveMatches()) {
        // Swap back if no match formed
        setTimeout(() => swapTiles(selectedTile, { r, c }), 200);
      } else {
        score += 150 * multiplier;
        updateScoreDisplay();
      }
      selectedTile = null;
    } else {
      selectedTile = { r, c };
    }
  }
  renderBoard();
}

function isAdjacent(t1, t2) {
  const dr = Math.abs(t1.r - t2.r);
  const dc = Math.abs(t1.c - t2.c);
  return (dr + dc) === 1;
}

function swapTiles(t1, t2) {
  const temp = board[t1.r][t1.c];
  board[t1.r][t1.c] = board[t2.r][t2.c];
  board[t2.r][t2.c] = temp;
  renderBoard();
}

function checkAndResolveMatches() {
  let matched = false;
  // Match-3 Check horizontally & vertically
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE - 2; c++) {
      let t1 = board[r][c].type, t2 = board[r][c+1].type, t3 = board[r][c+2].type;
      if (t1 !== 5 && t1 === t2 && t2 === t3) {
        board[r][c].type = Math.floor(Math.random() * 5);
        board[r][c+1].type = Math.floor(Math.random() * 5);
        board[r][c+2].type = Math.floor(Math.random() * 5);
        matched = true;
      }
    }
  }

  for (let c = 0; c < GRID_SIZE; c++) {
    for (let r = 0; r < GRID_SIZE - 2; r++) {
      let t1 = board[r][c].type, t2 = board[r+1][c].type, t3 = board[r+2][c].type;
      if (t1 !== 5 && t1 === t2 && t2 === t3) {
        board[r][c].type = Math.floor(Math.random() * 5);
        board[r+1][c].type = Math.floor(Math.random() * 5);
        board[r+2][c].type = Math.floor(Math.random() * 5);
        matched = true;
      }
    }
  }
  return matched;
}

function updateScoreDisplay() {
  document.getElementById('score-display').innerText = score.toLocaleString();
}

function updateTimerDisplay() {
  const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
  const s = String(timeRemaining % 60).padStart(2, '0');
  document.getElementById('timer-display').innerText = `${m}:${s}`;
}

function startTimer() {
  timerInterval = setInterval(() => {
    if (!isPaused && timeRemaining > 0) {
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining === 0) {
        showNotice("⏳ TIEMPO AGOTADO", "Utiliza el booster AdsGram (+⌛) para añadir tiempo y no perder tu puntuación.");
      }
    }
  }, 1000);
}

function togglePause() {
  isPaused = !isPaused;
  showNotice(isPaused ? "⏸️ PAUSA" : "▶️ JUEGO REANUDADO", isPaused ? "Juego pausado temporalmente." : "¡Continúa acumulando $XLABS!");
}

/* ==========================================================================
   INITIALIZATION ON WINDOW LOAD
   ========================================================================== */
window.onload = () => {
  loadSvgAssets();
  initBoard();
  setTimeout(() => {
    resizeCanvas();
    startTimer();
  }, 150);
};

window.addEventListener('resize', resizeCanvas);
</script>
</body>
