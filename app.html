<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xinergy Labs | MiniApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070b;--panel:rgba(16,22,31,.78);--line:rgba(255,255,255,.09);
  --green:#00ff66;--cyan:#00e5ff;--purple:#9d00ff;
  --text:#f4f7fa;--muted:#9aa8b6;
  --glow:rgba(0,255,102,.35);
  --head:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;
  background-image:radial-gradient(60% 35% at 85% 0%,rgba(157,0,255,.2),transparent),radial-gradient(50% 35% at 0% 40%,rgba(0,229,255,.1),transparent),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
